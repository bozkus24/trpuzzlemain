# Netlify yapılandırması — TrPuzzle anasayfa
# Statik site; derleme adımı yok, kök dizin olduğu gibi yayımlanır.

[build]
  publish = "."
  command = ""

# Temel güvenlik başlıkları.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML her zaman taze gelsin; statik varlıklar bir süre önbelleğe alınabilir.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
