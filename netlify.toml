# Netlify yapılandırması — TrPuzzle anasayfa
# Statik site; derleme adımı yok, kök dizin olduğu gibi yayımlanır.
#
# ÖNEMLİ: Aşağıdaki proxy kuralları, her oyunun Netlify sitesinin TAM OLARAK
# şu adlarla adlandırılmasını bekler (Site settings -> Change site name):
#   trpuzzle-harfle, trpuzzle-harf500, trpuzzle-baklava, trpuzzle-bagla,
#   trpuzzle-kesme, trpuzzle-sehirle, trpuzzle-tilkile, trpuzzle-arala
# Her /oyun yolu sonuna eğik çizgi eklenir (/oyun/) ve ilgili oyunun Netlify
# sitesine vekâlet edilir. Eğik çizgi ŞART: oyunun göreli dosyaları
# (style.css, game.js ...) /oyun/ altından çözülsün diye. Adres trpuzzle.com'da kalır.

[build]
  publish = "."
  command = ""

# ── Oyun yolları -> oyun siteleri ──

[[redirects]]
  from = "/harfle"
  to = "/harfle/"
  status = 301

[[redirects]]
  from = "/harfle/*"
  to = "https://trpuzzle-harfle.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/harf500"
  to = "/harf500/"
  status = 301

[[redirects]]
  from = "/harf500/*"
  to = "https://trpuzzle-harf500.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/baklava"
  to = "/baklava/"
  status = 301

[[redirects]]
  from = "/baklava/*"
  to = "https://trpuzzle-baklava.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/bagla"
  to = "/bagla/"
  status = 301

[[redirects]]
  from = "/bagla/*"
  to = "https://trpuzzle-bagla.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/kesme"
  to = "/kesme/"
  status = 301

[[redirects]]
  from = "/kesme/*"
  to = "https://trpuzzle-kesme.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/sehirle"
  to = "/sehirle/"
  status = 301

[[redirects]]
  from = "/sehirle/*"
  to = "https://trpuzzle-sehirle.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/tilkile"
  to = "/tilkile/"
  status = 301

[[redirects]]
  from = "/tilkile/*"
  to = "https://trpuzzle-tilkile.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/arala"
  to = "/arala/"
  status = 301

[[redirects]]
  from = "/arala/*"
  to = "https://trpuzzle-arala.netlify.app/:splat"
  status = 200

# Temel güvenlik başlıkları.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML her zaman taze gelsin; statik varlıklar bir süre önbelleğe alınabilir.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
